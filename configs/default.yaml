# QuakeTriage — default configuration
# Override values via .env or environment variables

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  outputs: outputs
  reports: reports

model:
  encoder: resnet34
  encoder_weights: imagenet
  in_channels: 6  # pre + post concatenated
  num_classes: 1
  mc_dropout_samples: 10
  mc_dropout_p: 0.1

training:
  batch_size: 8
  max_epochs: 50
  early_stopping_patience: 10
  learning_rate: 1.0e-4
  image_size: 512
  monitor_threshold: 0.5  # fixed threshold for val F1 used to pick the best epoch

inference:
  tile_size: 512
  overlap: 64         # pixels shared between neighbouring windows
  tta: true           # chosen uncertainty method: 8-view rot90 x flip TTA, std = uncertainty (docs/decisions.md)

rag:
  embedding_model: intfloat/multilingual-e5-small   # chosen by scripts/rag_ablation.py
  passage_prefix: "passage: "
  query_prefix: "query: "
  hybrid: true          # dense cosine + BM25, reciprocal-rank fusion
  max_seq_length: 256   # model default is 128; chunks are ~150-200 tokens
  chunk_chars: 700
  chunk_overlap_chars: 120
  top_k: 5

thresholds:
  damage_prob: 0.2       # operating threshold, F1-optimal on KATE-CD validation (docs/decisions.md)
  uncertainty_high: 0.2  # buildings above this go to verification queue
  guard_blank_ratio: 0.3
  guard_bright_ratio: 0.2
  guard_ssim_min: 0.05  # ~5th pct of KATE-CD pairs (see docs/decisions.md)

population:
  # ASSUMPTIONS (not measured data) used to turn WorldPop cell counts into per-building occupancy.
  night_factor: 0.9                 # share of residents at home at 04:17 (Feb 2023 quake)
  non_residential_night_factor: 0.1 # schools, shops, offices, mosques... at night
  default_floors: 3                 # when neither building:levels nor a type rule applies
  floors_by_type:                   # fallback by OSM `building` value
    house: 2
    detached: 2
    semidetached_house: 2
    residential: 3
    apartments: 5
    commercial: 3
    retail: 2
    school: 3
    hospital: 4
  residential_types: ["yes", house, detached, semidetached_house, residential, apartments, terrace]

topsis:
  weights:
    damage_prob: 0.35
    estimated_persons: 0.35
    floor_count: 0.15
    distance_to_depot: 0.15
  criteria_types:
    damage_prob: benefit
    estimated_persons: benefit
    floor_count: benefit
    distance_to_depot: cost

routing:
  mission_duration_hours: 6
  intervention_time_minutes: 30  # per building
  num_teams: 4                   # K search-and-rescue teams, all start/end at the depot
  candidate_n: 400               # VRP considers only the top-N buildings by TOPSIS priority
  solver_time_limit_s: 30        # OR-Tools wall-clock limit per solve
  distance_cache_dir: outputs/cache
  # Buildings cut off by closed roads: the team drives to the nearest reachable node and walks the
  # rest along the (closed) streets, out and back. Both values are assumptions.
  walking_speed_kmh: 3.0         # loaded, over rubble
  max_walk_m: 500                # farther than this -> building stays unreachable
  debris_risk_buffer_meters: 50
  debris_damage_prob_min: 0.5   # building counts as a debris source above this damage probability
  debris_min_floors: 3          # ... and at least this many floors (taller -> more debris)
  debris_penalty_factor: 3.0    # travel time of an at-risk road segment is multiplied by this
  debris_block_count: 5         # segment is closed if >= this many debris sources are in the buffer
  # Demo depots as [lon, lat] (WGS84); code converts to the project CRS and snaps to the road graph.
  # SCENARIO ASSUMPTION, not a real operations centre: centroid of the OSM building tagged
  # name=AFAD, office=government (way 1139261935, Antakya), read from Overpass on 2026-11-10.
  # See docs/decisions.md.
  depots:
    - [36.17179, 36.20657]

llm:
  provider: "${LLM_PROVIDER}"
  model: "${LLM_MODEL}"
  max_retries: 3
  retry_base_delay: 2.0
  fallback_provider: "${LLM_FALLBACK_PROVIDER:-}"   # used when the primary stays rate-limited
  fallback_model: "${LLM_FALLBACK_MODEL:-}"
  temperature: 0.0
  cache_dir: outputs/cache/llm

geo:
  demo_bbox: [36.10, 36.15, 36.25, 36.30]  # Antakya (minlon, minlat, maxlon, maxlat); osmnx>=2 order
  crs: "EPSG:32637"  # UTM zone 37N — Kahramanmaraş area
