name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # All extras: the agent tests import ortools/langgraph/sentence-transformers and the map
      # tests import folium. PyTorch is the CPU-only wheel on Linux (see [tool.uv.sources]).
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q -m "not slow and not network and not gpu"

  report-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/make_report.py --check
