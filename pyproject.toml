[project]
name = "quaketriage"
version = "0.1.0"
description = "Agentic post-earthquake building damage assessment and rescue prioritization"
requires-python = ">=3.11"
dependencies = [
    # Geo
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "osmnx>=1.9.1",
    "pystac-client>=0.7.5",
    # Data
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "pyarrow>=15.0.0",
    # Config / utilities
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3.1",
]
agent = [
    "langgraph>=1.2.19",
    "langchain-core>=0.1.33",
    "google-genai>=2.34.0",
    "groq>=0.5.0",
    "pypdf>=4.1.0",
    "sentence-transformers>=2.6.1",
    "ortools>=9.9.3963",
]
ui = [
    "gradio>=4.21.0",
    "folium>=0.16.0",
]
all = [
    "quaketriage[train,agent,ui]",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaketriage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
    "gpu: marks tests that require a GPU (MPS or CUDA)",
]
