[project]
name = "quaketriage"
version = "0.1.0"
description = "Agentic post-earthquake building damage assessment and rescue prioritization"
requires-python = ">=3.11"
dependencies = [
    # Deep learning
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3.1",
    # Geo
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "osmnx>=1.9.1",
    "pystac-client>=0.7.5",
    # Data
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "pyarrow>=15.0.0",
    # Optimization
    "ortools>=9.9.3963",
    # RAG
    "pypdf>=4.1.0",
    "sentence-transformers>=2.6.1",
    # Agent
    "langgraph>=0.0.38",
    "langchain-core>=0.1.33",
    "groq>=0.5.0",
    # UI
    "gradio>=4.21.0",
    "folium>=0.16.0",
    # Config
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "google-genai>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quaketriage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
